# Ambiente local — sobe Postgres e a aplicação em containers.
# Nada precisa estar instalado na máquina além do Docker.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idpro
      POSTGRES_PASSWORD: idpro
      POSTGRES_DB: idpro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://idpro:idpro@db:5432/idpro?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-troque-em-producao}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@idpro.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-idpro}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
