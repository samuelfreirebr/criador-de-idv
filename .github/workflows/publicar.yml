name: Publicar imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nome de imagem Docker não aceita maiúsculas, e o usuário do GitHub pode
      # ter. Forçar minúsculas aqui evita um erro que só aparece no push.
      - name: Nome da imagem em minúsculas
        id: nome
        run: echo "imagem=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/idpro" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A hash do commit também vira tag, para conseguir voltar a uma
          # versão anterior sem reconstruir.
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
